{% extends "base.html" %}

{% block title %}Registro - YouthDev{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg border-0">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">
                    <i class="fas fa-user-plus text-primary"></i> Crear Cuenta
                </h2>
                
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="full_name" class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="username" class="form-label">Nombre de Usuario</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="6">
                    </div>
                    
                    <div class="mb-4">
                        <label for="role" class="form-label">¿Qué tipo de usuario eres?</label>
                        <select class="form-select" id="role" name="role" required onchange="toggleInstructorSelect()">
                            <option value="" disabled selected>Selecciona...</option>
                            <option value="participant">🎓 Soy un joven participante</option>
                            <option value="instructor">👨‍🏫 Soy instructor</option>
                        </select>
                    </div>
                    
                    <div class="mb-4 d-none" id="instructor_select_div">
                        <label for="instructor_id" class="form-label">Selecciona tu Instructor</label>
                        <select class="form-select" id="instructor_id" name="instructor_id">
                            <option value="" disabled selected>Elige un instructor...</option>
                            {% for instructor in instructors %}
                                <option value="{{ instructor.id }}">{{ instructor.full_name }}</option>
                            {% endfor %}
                        </select>
                        <small class="text-muted">Tu instructor podrá ver tu progreso y ayudarte</small>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-user-plus"></i> Registrarse
                        </button>
                    </div>
                </form>
                
                <hr class="my-4">
                
                <div class="text-center">
                    <p class="mb-0">¿Ya tienes cuenta?</p>
                    <a href="{{ url_for('login') }}" class="btn btn-outline-secondary">
                        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function toggleInstructorSelect() {
    const role = document.getElementById('role').value;
    const instructorDiv = document.getElementById('instructor_select_div');
    const instructorSelect = document.getElementById('instructor_id');
    
    if (role === 'participant') {
        instructorDiv.classList.remove('d-none');
        instructorSelect.required = true;
    } else {
        instructorDiv.classList.add('d-none');
        instructorSelect.required = false;
    }
}
</script>
{% endblock %}
