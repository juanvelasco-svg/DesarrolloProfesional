{% extends "base.html" %}

{% block title %}Iniciar Sesión - YouthDev{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg border-0">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">
                    <i class="fas fa-sign-in-alt text-primary"></i> Iniciar Sesión
                </h2>
                
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="role" class="form-label">Tipo de Usuario</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="" disabled selected>Selecciona tu rol...</option>
                            <option value="participant">🎓 Participante (Joven)</option>
                            <option value="instructor">👨‍🏫 Instructor</option>
                            <option value="admin">🔐 Administrador</option>
                        </select>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-sign-in-alt"></i> Ingresar
                        </button>
                    </div>
                </form>
                
                <hr class="my-4">
                
                <div class="text-center">
                    <p class="mb-0">¿No tienes cuenta?</p>
                    <a href="{{ url_for('register') }}" class="btn btn-outline-secondary">
                        <i class="fas fa-user-plus"></i> Registrarse
                    </a>
                </div>
                
                <div class="mt-4 p-3 bg-light rounded">
                    <small class="text-muted">
                        <strong>Credenciales de prueba:</strong><br>
                        Admin: admin / admin123<br>
                        Instructor: instructor1 / inst123
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
